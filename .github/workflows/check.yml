# Runs on every pull request. Nothing here can deploy or publish:
# it holds no secrets and only reads the repository.
name: Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # The official Python images, not the runner's own Python: GitHub's current
    # runners no longer offer 3.9, and 3.9 is what the server runs.
    container: python:${{ matrix.python }}-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what the server runs; 3.12 is what the build tools use.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - run: python -m unittest discover -s backend -p 'test_*.py'

  site:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build inputs
        run: python tools/build.py --check
      - name: Frontend syntax
        run: node --check site/app.js && node --check site/verify.js
      - name: Install the browser
        run: |
          python -m pip install --quiet playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Build
        run: python tools/build.py
      - name: Browser checks
        run: python tools/browser_check.py
      # The site must also build and pass with launch-day token values.
      - name: The same, as the site will be once the token is live
        run: |
          python tools/build.py --simulate-launch --out dist-launched
          python tools/browser_check.py --dir dist-launched
      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: dist
          retention-days: 7
