# Every push to main is a release: check, build, attest, deploy, confirm.
#
# This workflow holds no secrets.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    name: Build and attest
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          python -m pip install --quiet playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Build
        run: python tools/build.py
      - name: Browser checks on the exact files being deployed
        run: python tools/browser_check.py
      - name: Attest the manifest and the observer source
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/observer.py.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            dist/SHA256SUMS
            dist/build.json
            dist/observer.py.txt
          retention-days: 90

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  confirm:
    name: Confirm the public site serves this commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Checks the address Pages reports: the branded hostname once it is
      # attached, the github.io preview before that.
      - run: python tools/verify_live.py --site "$PAGE_URL" --commit "$GITHUB_SHA" --wait 600
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
